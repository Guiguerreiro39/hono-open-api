pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{js,mjs,cjs,ts,mts,cts,tsx}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    prevent-direct-default-branch-push:
      run: bash scripts/check-branch-push.sh
